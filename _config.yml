#
# 站点配置 —— Heluowen 个人主页
#

# 站点名称（导航、页脚、SEO 使用）
name: Heluowen

# 一句话简介，显示在首屏名字下面
description: 大学生 · 写点代码，做点好玩的东西

# 首屏更详细的一段自我介绍
intro: 我叫河洛温，偶尔会在这折腾一切让我好奇的东西。这里放着我的项目和随笔。

# 头像地址（想换成本地图片就写 /images/avatar.jpg）
avatar: /images/avatar.jpg

# GitHub 用户名：项目卡片、star 自动刷新、页脚链接都基于它
github_username: Heluowen

# 首屏技能 / 兴趣小标签
tags:
  - Python
  - TypeScript
  - AstrBot 插件
  - 音游自制

#
# 外观
#
appearance:
  accent: "#22d3ee"        # 主色（青）
  accent_alt: "#a855f7"    # 副色（紫）
  background:
    # 背景图地址：把图片放进 images/backgrounds/，这里写 /images/backgrounds/文件名
    # 留空则使用默认的星云渐变
    image: /images/backgrounds/bg0.jpg
    overlay: 30            # 图片上方的压暗遮罩浓度 0-90
    blur: 0                # 背景图模糊程度 0-24（单位 px）
  glass:
    blur: 25               # 毛玻璃模糊半径
    opacity: 6             # 玻璃层白色透明度（百分比，越大越不透明）
  motion: true             # 关掉后停用滚动入场 / 视差 / 悬浮倾斜动画

#
# 项目列表
#
projects:
  refresh: true            # 打开页面后调 GitHub API 刷新 star / fork / 更新时间
  stats: true              # 首屏是否显示数字条

#
# 页脚社交链接（留空即隐藏对应图标）
#
footer-links:
  email: heluowen0831@gmail.com
  github: Heluowen
  rss: true

# 文章评论（填 Disqus shortname 才会显示）
disqus:

# Google Analytics 跟踪码
google_analytics:

# 站点 URL（sitemap、feed 用）
url: https://heluowen.github.io

# 如果是 project 仓库而不是 username.github.io，在这里填 /仓库名
baseurl: ""

#
# !! 以下一般不需要改动 !!
#

permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

gems:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - tools
  - node_modules
  - _preview
