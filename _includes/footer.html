<footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__social">
          {% if site.footer-links.github %}
          <a href="https://github.com/{{ site.footer-links.github }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
            {% include icon-github.html %}
          </a>
          {% endif %}
          {% if site.footer-links.email %}
          <a href="mailto:{{ site.footer-links.email }}" aria-label="Email" title="{{ site.footer-links.email }}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3"></rect>
              <path d="m3.5 7 8.5 6 8.5-6"></path>
            </svg>
          </a>
          {% endif %}
          {% if site.footer-links.rss %}
          <a href="{{ site.baseurl }}/feed.xml" aria-label="RSS" title="RSS">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="6" cy="18" r="1.6" fill="currentColor" stroke="none"></circle>
              <path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"></path>
            </svg>
          </a>
          {% endif %}
        </div>
        <p class="site-footer__copy">© {{ site.time | date: "%Y" }} {{ site.name }} · Built with Jekyll &amp; GitHub Pages</p>
      </div>
    </footer>
