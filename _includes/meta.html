<meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name="theme-color" content="#06070b">
    <meta name="color-scheme" content="dark">

    {% assign og_desc = page.excerpt | default: site.intro | default: site.description %}
    <meta name="description" content="{{ og_desc | strip_html | normalize_whitespace }}" />
    <meta name="author" content="{{ site.name }}" />

    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
    <meta property="og:description" content="{{ og_desc | strip_html | normalize_whitespace }}" />
    <meta property="og:image" content="{{ site.avatar | absolute_url }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="{{ site.avatar | absolute_url }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title }}" />
    <meta name="twitter:title" content="{{ page.title }}" />
    {% else %}
    <meta property="og:title" content="{{ site.name }} – {{ site.description }}" />
    <meta name="twitter:title" content="{{ site.name }} – {{ site.description }}" />
    {% endif %}
